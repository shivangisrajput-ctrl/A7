<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <link rel="stylesheet" href="flex.css">

</head>


<body>

    <div class="form-container">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Create your student account
        </p>


        <form action="login.html">

            <!-- NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                minlength="8"
                maxlength="16"
                title="Password must contain 8 to 16 characters"
                required
            >


            <!-- GENDER -->

            <label>
                Gender
            </label>

            <div class="options">

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="male"
                        required
                    >
                    Male
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="female"
                    >
                    Female
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="other"
                    >
                    Other
                </label>

            </div>


            <!-- DOB -->

            <label for="dob">
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
                name="dob"
                required
            >


            <!-- FILE -->

            <label for="photo">
                Upload Your Photo
            </label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
            >


            <!-- SUBJECTS -->

            <label>
                Select Subjects
            </label>

            <div class="options">

                <label>
                    <input
                        type="checkbox"
                        name="subject"
                        value="computer"
                    >
                    Computer Science
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="subject"
                        value="mathematics"
                    >
                    Mathematics
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="subject"
                        value="physics"
                    >
                    Physics
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="subject"
                        value="english"
                    >
                    English
                </label>

            </div>


            <!-- SUBMIT -->

            <button type="submit">
                Register
            </button>

        </form>


        <p class="bottom-text">
            Already registered?
            <a href="login.html">Login here</a>
        </p>

    </div>

</body>

</html>
